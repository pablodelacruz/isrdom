<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Calculator body -->
  <rect x="16" y="20" width="96" height="88" rx="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  
  <!-- Display screen -->
  <rect x="24" y="28" width="80" height="20" rx="2" fill="#374151"/>
  
  <!-- Display numbers -->
  <text x="96" y="42" font-family="monospace" font-size="12" fill="white" text-anchor="end">100000</text>
  
  <!-- Paper roll -->
