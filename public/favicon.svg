  <rect x="76" y="68" width="12" height="8" rx="1" fill="#4b5563"/>
  
  <!-- Row 3 -->
  <rect x="28" y="80" width="12" height="8" rx="1" fill="#4b5563"/>
  <rect x="44" y="80" width="12" height="8" rx="1" fill="#4b5563"/>
  <rect x="60" y="80" width="12" height="8" rx="1" fill="#4b5563"/>
  <rect x="76" y="80" width="12" height="16" rx="1" fill="#4b5563"/>
  
  <!-- Row 4 -->
